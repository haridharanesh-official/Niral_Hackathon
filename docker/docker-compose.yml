services:
  postgres:
    image: postgres:16-alpine
    container_name: hackos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hackos
      POSTGRES_PASSWORD: hackos_secret
      POSTGRES_DB: hackos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hackos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackos -d hackos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hackos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hackos_redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hackos-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: hackos-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://hackos:hackos_secret@postgres:5432/hackos?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      WEB_URL: http://localhost:3000
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: noreply@niral.example.test
      MAIL_QUEUE_ENABLED: "true"
      MAIL_QUEUE_KEY: ${MAIL_QUEUE_KEY:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: hackos-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: change-me-in-production-use-long-random-string
      NEXTAUTH_SECRET: change-me-in-production-use-long-random-string
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles: ["full"]

volumes:
  hackos_pgdata:
  hackos_redis:
